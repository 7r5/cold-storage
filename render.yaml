# Render Blueprint: deploys the API, the Web (static site) and Prisma Studio
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: cold-chain-control-db
    plan: free
    databaseName: cold_chain_control
    user: cold_chain_control

services:
  # Backend API (Express + Socket.IO + Prisma)
  - type: web
    name: cold-chain-control-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npx prisma generate && npx prisma db push && node prisma/seed.js
    startCommand: node src/index.js
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: cold-chain-control-db
          property: connectionString
      - key: CORS_ORIGIN
        sync: false

  # Frontend (Vite static build)
  - type: web
    name: cold-chain-control-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    buildFilter:
      paths:
        - frontend/**
        - render.yaml
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Prisma Studio (Explorador de Base de Datos)
  # autoDeploy: false — only redeploy manually when schema changes
  - type: web
    name: cold-chain-control-studio
    runtime: node
    plan: free
    rootDir: backend
    autoDeploy: false
    buildCommand: npm ci && npx prisma generate --schema=./prisma/schema.prisma
    startCommand: node src/studio-proxy.js
    buildFilter:
      paths:
        - backend/prisma/schema.prisma
        - backend/src/studio-proxy.js
        - render.yaml
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cold-chain-control-db
          property: connectionString
      - key: PRISMA_CLI_QUERY_ENGINE_TYPE
        value: binary
      - key: PRISMA_CLIENT_ENGINE_TYPE
        value: binary