# Render Blueprint: deploys the API (Node web service) and the
# Web (static site) as independent services + a free PostgreSQL.
#
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: cold-chain-control-db
    plan: free
    databaseName: cold_chain_control
    user: cold_chain_control

services:
  # Backend API (Express + Socket.IO + Prisma)
  - type: web
    name: cold-chain-control-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma db push && node prisma/seed.js
    startCommand: node src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: cold-chain-control-db
          property: connectionString
      - key: CORS_ORIGIN
        sync: false # set to the static site URL after first deploy

  # Frontend (Vite static build)
  - type: static
    name: cold-chain-control-web
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false # set to the API service public URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
